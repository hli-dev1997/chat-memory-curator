server:
  port: 520

spring:
  application:
    name: chatgpt-memory-exporter
  config:
    import:
      - optional:classpath:application-secret.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/chat_memory_curator?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: Q836184425
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 10000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

chat:
  user-id: EMP001      # 用户 ID / 工号
  source: CHATGPT      # 数据源: CHATGPT, GEMINI, CLAUDE, KIMI 等
  platform: WEB        # 终端平台: WEB (网页端), IDE (编辑器插件), APP (移动端) 等
  session:
    split-interval-hours: 4
  segmentation:
    l1-high-threshold: 0.82  # 极严格强相关门限 (>= 0.82 允许直接合并)
    l1-low-threshold: 0.60   # 跨主题切断门限 (< 0.60 强制打断)
    short-text-min-length: 30 # 提高短句判定阈值为 30 字，使“那为什么还是不行呢”(9字)等追问自动拼接上文 Chunk
    l2-auto-run-enabled: false # 设置为 false，禁止应用启动时自动跑 L2，改为通过页面按钮手动触发
    l2-auto-run-limit: 100    # 定量记录数上限（由页面输入框参数覆盖控制）
    l2-force-overwrite: true  # 覆盖推导开关
    l2-concurrency-limit: 15  # Stage 2 大模型响应式并发推导上限通道数 (支持按 API 限流调整)
  parser:
    retain-roles:
      - user
      - assistant

qwen:
  text-model: qwen-plus                    # 默认纯文本大语言模型 (阿里云 DashScope 平台全量 1,000,000 免费 Token 额度)
  multimodal-model: qwen3-omni-flash       # 默认全模态大模型 (阿里云 DashScope 平台全量 1,000,000 免费 Token 额度)
  base-url: https://ws-dzx3vakjj1wmjyha.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  timeout-seconds: 60
  log-requests: true
  log-responses: true

